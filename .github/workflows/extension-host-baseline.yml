name: Extension Host paired baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-host-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Baseline (${{ matrix.os }}, VS Code ${{ matrix.vscode-version }})
    if: github.repository == 'Zemdomu/ZemDomu-extension'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        vscode-version: ["1.105.0", "1.144.0"]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
      ZEMDOMU_BASELINE_RESULTS_DIR: ${{ github.workspace }}/baseline-results
    steps:
      - name: Checkout exact measurement source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate baseline contracts
        run: node --test tests/extension-host/baseline-contract.test.js

      - name: Test, package, and inspect measured product
        run: npm run package

      - name: Measure five fixed control and product pairs on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension-host-baseline

      - name: Measure five fixed control and product pairs on Windows
        if: runner.os == 'Windows'
        run: npm run test:extension-host-baseline

      - name: Retain every measurement and failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-baseline-${{ matrix.os }}-${{ matrix.vscode-version }}-${{ github.run_attempt }}
          path: baseline-results/
          if-no-files-found: error
          retention-days: 14
