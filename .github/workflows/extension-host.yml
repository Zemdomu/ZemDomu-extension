name: Extension Host Performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    if: github.repository == 'Zemdomu/ZemDomu-extension'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VSCODE_TEST_VERSION: stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test, package, and inspect VSIX
        run: npm run package

      - name: Measure real VS Code Extension Host performance
        run: xvfb-run -a npm run test:extension-host
