name: Property fuzz tests

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Optional signed 32-bit seed to replay a failing sweep
        required: false
        type: string
      runs:
        description: Generated cases per property (1 to 10000)
        required: true
        default: '1000'
        type: string

permissions:
  contents: read

concurrency:
  group: property-fuzz-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    if: >-
      github.repository == 'Zemdomu/ZemDomu-core' ||
      github.repository == 'Zemdomu/ZemDomu-extension' ||
      github.repository == 'Zemdomu/ZemDomu-action'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZEMDOMU_FUZZ_RUNS: ${{ inputs.runs || '1000' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Select and record the reproducible seed
        env:
          REQUESTED_FUZZ_SEED: ${{ inputs.seed }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const raw = process.env.REQUESTED_FUZZ_SEED || '';
          const seed = raw === '' ? Number(BigInt(process.env.GITHUB_RUN_ID) % 2147483647n) : Number(raw);
          if ((raw !== '' && !/^-?\d+$/.test(raw)) || !Number.isInteger(seed) || seed < -2147483648 || seed > 2147483647) {
            throw new Error('The fuzz seed must be a signed 32-bit integer.');
          }
          appendFileSync(process.env.GITHUB_ENV, `ZEMDOMU_FUZZ_SEED=${seed}\n`);
          console.log(`Fuzz seed: ${seed}; cases per property: ${process.env.ZEMDOMU_FUZZ_RUNS}`);
          JS
      - name: Install locked development dependencies
        run: npm ci
      - name: Exercise generated inputs and shrink any failures
        run: npm run test:fuzz
