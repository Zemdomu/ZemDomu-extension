name: Sign release downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public release tag whose downloads should be signed
        required: true
        type: string
  repository_dispatch:
    types: [zemdomu-sign-release]

permissions:
  contents: read

concurrency:
  group: release-signing-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.repository == 'Zemdomu/ZemDomu-core' ||
       github.repository == 'Zemdomu/ZemDomu-extension' ||
       github.repository == 'Zemdomu/ZemDomu-action')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the signing workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install the verified signing tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify the exact published downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: node .github/scripts/sign-release-artifacts.mjs "$RELEASE_TAG"
