name: Build and attest public Extension artifact

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed current public main commit (40 lowercase hex characters)
        required: true
        type: string
      version:
        description: Exact prepared package version; this workflow never bumps or publishes it
        required: true
        type: string
      prerelease:
        description: Include the Marketplace pre-release marker in the inspected VSIX
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-extension-build-${{ inputs.version }}-${{ inputs.prerelease }}
  cancel-in-progress: false

env:
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  VSCODE_TEST_VERSION: stable

jobs:
  build:
    name: Build inspected public VSIX
    if: >-
      github.repository == 'Zemdomu/ZemDomu-extension' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-name: ${{ steps.bind.outputs.artifact_name }}
      vsix-digest: ${{ steps.bind.outputs.vsix_digest }}
      candidate-digest: ${{ steps.bind.outputs.candidate_digest }}
    steps:
      - name: Select isolated artifact directory
        shell: bash
        run: printf 'BUILD_OUTPUT=%s/public-extension-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out exact public build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up public build tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Test public build boundaries offline
        run: node --test .github/tests/build-release-artifact.test.mjs .github/tests/build-release-workflow.test.mjs
      - name: Verify exact public source and all release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-release-artifact.mjs gate
      - name: Install locked dependencies
        run: npm ci
      - name: Validate mapped TypeScript coverage
        run: npm run test:coverage
      - name: Build, audit, test and install final VSIX
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a npm run release:check
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            npx --no-install vsce package --pre-release --no-dependencies --readme-path docs/USER_GUIDE.md --out dist/zemdomu.vsix
            node tests/package-contents.test.js
            node tests/package-size.test.js --vsix
            xvfb-run -a npm run test:vsix-install
          fi
      - name: Bind inspected VSIX and public metadata
        id: bind
        run: node .github/scripts/build-release-artifact.mjs prepare
      - name: Retain inspected public build
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bind.outputs.input_artifact_name }}
          path: ${{ env.BUILD_OUTPUT }}/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  attest:
    name: Attest inspected public VSIX
    needs: build
    if: >-
      github.repository == 'Zemdomu/ZemDomu-extension' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      BUILD_ARTIFACT_DIGEST: sha256:${{ needs.build.outputs.artifact-digest }}
      BUILD_VSIX_DIGEST: ${{ needs.build.outputs.vsix-digest }}
      BUILD_CANDIDATE_DIGEST: ${{ needs.build.outputs.candidate-digest }}
    steps:
      - name: Select isolated artifact directory
        shell: bash
        run: printf 'BUILD_OUTPUT=%s/public-extension-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out exact public verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up public verification tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Download inspected build by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ env.BUILD_OUTPUT }}/
          merge-multiple: true
      - name: Verify inspected build identity and all release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-release-artifact.mjs verify
      - name: Attest exact inspected VSIX
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.BUILD_OUTPUT }}/zemdomu.vsix
          create-storage-record: false
      - name: Preserve original provenance bundle and DSSE
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: node .github/scripts/build-release-artifact.mjs provenance
      - name: Retain attested public release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.BUILD_OUTPUT }}/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
